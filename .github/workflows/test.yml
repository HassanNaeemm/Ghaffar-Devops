name: Test and Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel authentication
        run: |
          vercel whoami --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Link Vercel project
        run: |
          vercel link \
            --yes \
            --project="${{ secrets.PROJECT_ID }}" \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.ORG_ID }}"

      - name: Pull Vercel project settings
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.ORG_ID }}"

      - name: Build Vercel project
        run: |
          vercel build \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.ORG_ID }}"

      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.ORG_ID }}"
